<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Valley Lot Finder</title>
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lot Finder">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="map"></div>

<div class="top">
  <div class="brand">VALLEY LOT FINDER</div>
  <div class="keyrow">
    <span><i style="background:#ff8a00"></i>For lease</span>
    <span><i style="background:#a855f7"></i>Vacant</span>
    <span><i style="background:#8b8f99"></i>Abandoned</span>
    <span><i style="background:#ef4444"></i>Closed</span>
  </div>
</div>

<div class="fabs">
  <button id="btnLocate" class="fab" aria-label="My location"><svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.9 3A9 9 0 0 0 13 3.1V1h-2v2.1A9 9 0 0 0 3.1 11H1v2h2.1A9 9 0 0 0 11 20.9V23h2v-2.1a9 9 0 0 0 7.9-7.9H23v-2h-2.1zM12 19a7 7 0 1 1 0-14 7 7 0 0 1 0 14z"/></svg></button>
</div>

<div class="bottom">
  <div id="status" class="status">Loading…</div>
  <button id="btnNearest" class="primary">⌖ NEAREST LOTS</button>
</div>

<!-- Lot card -->
<div id="card" class="sheet hidden">
  <div class="grab"></div>
  <div id="photo" class="photo"><div class="photo-empty">No photo</div></div>
  <div class="card-body">
    <div class="row"><span id="cBadge" class="badge"></span><button id="cClose" class="x" aria-label="Close">✕</button></div>
    <div id="cName" class="name">—</div>
    <div id="cAddr" class="addr">—</div>
    <div id="cMeta" class="meta">—</div>
    <a id="cSrc" class="src" href="#" target="_blank" rel="noopener">Source ↗</a>
    <div class="notes">
      <div id="cNotes" class="notelist"></div>
      <form id="noteForm" class="noteform">
        <input id="noteText" placeholder="Notes" autocomplete="off" maxlength="300">
        <button type="submit">Save</button>
      </form>
    </div>
    <div class="btns">
      <button id="cNav" class="primary">➤ NAVIGATE</button>
    </div>
  </div>
</div>

<!-- Nearest list -->
<div id="list" class="sheet hidden">
  <div class="grab"></div>
  <div class="row pad"><div class="title">Nearest lots</div><button id="listClose" class="x" aria-label="Close">✕</button></div>
  <div id="listBody" class="listbody"></div>
</div>

<!-- Navigate chooser -->
<div id="nav" class="sheet hidden">
  <div class="grab"></div>
  <div class="row pad"><div class="title">Open directions in</div><button id="navClose" class="x" aria-label="Close">✕</button></div>
  <div id="navBody" class="listbody"></div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
