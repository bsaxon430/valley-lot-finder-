<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Valley Lot Finder</title>
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lot Finder">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=30">
</head>
<body>
<div id="map"></div>

<div class="top">
  <div class="brand">VALLEY LOT FINDER</div>
</div>

<div class="fabs">
  <button id="btnLayers" class="fab" aria-label="Map or satellite"><svg viewBox="0 0 24 24"><path d="M11.99 18.54l-7.37-5.73L3 14.07l9 7 9-7-1.63-1.27-7.38 5.74zM12 16l7.36-5.73L21 9l-9-7-9 7 1.63 1.27L12 16z"/></svg></button>
  <button id="btnLocate" class="fab" aria-label="My location"><span class="dot"></span></button>
</div>

<div class="bottom">
  <div id="status" class="status">Loading…</div>
  <div class="views">
    <button class="view on" data-view="all">ALL</button>
    <button class="view" data-view="great">GREAT</button>
    <button class="view" data-view="revisit">REVISIT</button>
    <button class="view" data-view="skip">SKIPPED</button>
  </div>
  <button id="btnNearest" class="primary">⌖ NEAREST LOTS</button>
</div>

<!-- Lot card -->
<div id="card" class="sheet hidden">
  <div class="grab"></div>
  <div id="photo" class="photo"><div class="photo-empty">No photo</div></div>
  <div class="card-body">
    <div class="row"><span id="cBadge" class="badge"></span><button id="cClose" class="x" aria-label="Close">✕</button></div>
    <div id="cName" class="name">—</div>
    <div id="cAddr" class="addr">—</div>
    <div id="cMeta" class="meta">—</div>
    <a id="cSrc" class="src" href="#" target="_blank" rel="noopener">Source ↗</a>
    <div class="marks">
      <button id="mkGreat" data-mark="great">✓ Totally empty — great</button>
      <button id="mkRevisit" data-mark="revisit">? Worth revisiting</button>
      <button id="mkSkip" data-mark="skip">✕ Shared lot — skip</button>
    </div>
    <div class="notes">
      <div id="cNotes" class="notelist"></div>
      <form id="noteForm" class="noteform">
        <input id="noteText" placeholder="Notes" autocomplete="off" maxlength="300">
        <button type="submit">Save</button>
      </form>
    </div>
    <div class="btns">
      <button id="cNav" class="primary">➤ NAVIGATE</button>
      <button id="cDelSpot" class="ghost hidden">Remove this spot</button>
      <div class="credit">Map imagery © Esri, Maxar, Earthstar Geographics · Photos © Google</div>
    </div>
  </div>
</div>

<!-- Nearest list -->
<div id="list" class="sheet hidden">
  <div class="grab"></div>
  <div class="row pad"><div class="title">Nearest lots</div><button id="listClose" class="x" aria-label="Close">✕</button></div>
  <div id="listBody" class="listbody"></div>
</div>

<!-- Navigate chooser -->
<div id="nav" class="sheet hidden">
  <div class="grab"></div>
  <div class="row pad"><div class="title">Open directions in</div><button id="navClose" class="x" aria-label="Close">✕</button></div>
  <div id="navBody" class="listbody"></div>
</div>

<!-- Add a spot (long-press on the map) -->
<div id="add" class="sheet hidden">
  <div class="grab"></div>
  <div class="row pad"><div class="title">Add a spot here</div><button id="addClose" class="x" aria-label="Close">✕</button></div>
  <form id="addForm" class="addform">
    <div id="addAddr" class="addr">Finding address…</div>
    <input id="addName" placeholder="What is it? (e.g. Empty Kmart lot)" autocomplete="off" maxlength="80" required>
    <button type="submit" class="primary">＋ ADD SPOT</button>
  </form>
</div>

<div id="toast" class="toast hidden"></div>

<script src="https://unpkg.com/@googlemaps/markerclusterer@2.5.3/dist/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js?v=30"></script>
<script src="app.js?v=30"></script>
</body>
</html>
